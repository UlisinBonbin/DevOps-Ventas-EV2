name: Pipeline Backend Ventas

on:
  push:
    branches:
      - deploy

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ulises2002/back-ventas:latest

      # --- NUEVA SECCIÓN KUBERNETES ---
      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # ¡Vital para entornos académicos!
          aws-region: us-east-1

      - name: Conectar al clúster EKS
        run: |
          aws eks update-kubeconfig --region us-east-1 --name innovatech-cluster

      - name: Desplegar nueva versión en Kubernetes
        run: |
          # Esto le dice a Kubernetes que apague los contenedores viejos y levante los nuevos con la imagen recién subida
          kubectl rollout restart deployment/ventas-backend