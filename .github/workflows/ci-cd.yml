name: Pipeline Backend Ventas

# 1. El disparador: Se ejecutará solo cuando hagas push a la rama 'deploy'
on:
  push:
    branches:
      - deploy

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Clonar el código del repositorio en el servidor de GitHub
      - name: Checkout del código
        uses: actions/checkout@v3

      # Paso 2: Configurar Java (necesario para compilar tu proyecto Spring Boot)
      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Paso 3: Iniciar sesión en Docker Hub usando los Secrets que configuraste
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Paso 4: Construir la imagen Docker y subirla a Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # IMPORTANTE: Reemplaza "ulises2002/back-ventas" por el nombre exacto de tu repositorio en Docker Hub
          tags: ulises2002/back-ventas:latest