name: Pipeline Backend Ventas

on:
  push:
    branches:
      - deploy

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ulises2002/back-ventas:latest

      - name: Desplegar Ventas vía Docker Compose
        uses: appleboy/ssh-action@master
        with:
          # --- DATOS DEL BACKEND (Destino final) ---
          host: ${{ secrets.EC2_BACKEND_PRIVATE_IP }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          # --- DATOS DEL FRONTEND (El puente/Bastion) ---
          proxy_host: ${{ secrets.EC2_HOST }}
          proxy_username: ${{ secrets.EC2_USER }}
          proxy_key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd /home/ec2-user/DevOps-Infra-EV2
            git pull origin main
            sudo docker compose -f docker-compose-back.yml pull
            sudo docker compose -f docker-compose-back.yml up -d